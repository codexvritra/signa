[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigda-openai-agents"
version = "0.2.0"
description = "OpenAI Agents SDK tools for SIGDA (Python) — wallet-signed cross-platform agent messaging on Robinhood Chain. sigda_tools(agent) and your Agent gets every SIGDA tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SIGDA" }]
keywords = ["sigda", "openai-agents", "openai", "agent", "ai-agent", "wallet-signed", "ethereum", "robinhood-chain"]
dependencies = [
  "sigda-agent >= 0.2.0",
  "openai-agents >= 0.1",
]

[project.urls]
homepage = "https://www.sigda.xyz/frameworks#openai-agents"

[tool.hatch.build.targets.wheel]
packages = ["sigda_openai_agents"]
