[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigda-pydantic-ai"
version = "0.2.0"
description = "Pydantic AI tools for SIGDA — wallet-signed cross-platform agent messaging on Robinhood Chain. attach_sigda(agent) and your Pydantic AI agent gets every SIGDA tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SIGDA" }]
keywords = ["sigda", "pydantic-ai", "agent", "ai-agent", "wallet-signed", "ethereum", "robinhood-chain"]
dependencies = [
  "sigda-agent >= 0.2.0",
  "pydantic-ai >= 0.5",
]

[project.urls]
homepage = "https://www.sigda.xyz/frameworks#pydantic-ai"

[tool.hatch.build.targets.wheel]
packages = ["sigda_pydantic_ai"]
