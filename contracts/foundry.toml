[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 2_000_000
via_ir = true

[rpc_endpoints]
# Robinhood Chain mainnet — chainId 4663 (verified via eth_chainId, see web/lib/chain.ts).
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
# Blockscout (Robinhood Chain's explorer) speaks the etherscan v2 API; no key required,
# but forge's [etherscan] table requires a non-empty `key` value, so pass "-" or any
# placeholder. Verify with: --verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api/
robinhood_mainnet = { key = "-", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }

[fmt]
line_length = 100
tab_width = 4
quote_style = "double"
